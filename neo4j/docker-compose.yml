version: "3.2"
services:
  neo4j:
    image: neo4j:latest
    container_name: 'devneo4j'
    volumes:
      - '$HOME/neo4j/data:/data'
      - '$HOME/neo4j/conf/:/conf/'
      - '$HOME/neo4j/import:/var/lib/neo4j/import'
      - '$HOME/neo4j/logs:/logs'
    ports:
      - 7474:7474
      - 7687:7687
    restart: on-failure
    networks:
        - mybridge
    command: neo4j

networks:
  mybridge:
    driver: bridge
    external: true
    
volumes:
  dgraph:
